{% extends "base.html" %}

{% block title %}Log in · ShopLab{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>

        {% if form.errors %}
          <div class="alert alert-danger">Wrong username or password. Please try again.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <!-- Keep the typed username after a failed attempt, so only the password needs retyping -->
            <input class="form-control" type="text" name="username" id="id_username"
                   value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control" type="password" name="password" id="id_password"
                   autocomplete="current-password" required>
          </div>
          <!-- Return the user to the page they were trying to reach -->
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-dark w-100" type="submit">Log in</button>
        </form>

        <p class="mt-3 mb-0 small text-center">
          New here? <a href="{% url 'accounts:signup' %}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
