{% extends "base.html" %}

{% block title %}My Account · ShopLab{% endblock %}

{% block content %}
<h1 class="h3 mb-4">My Account</h1>

<div class="row g-4">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h6 text-uppercase text-muted mb-3">Profile</h2>
        <dl class="row mb-0">
          <dt class="col-5">Username</dt>
          <dd class="col-7">{{ user.username }}</dd>
          <dt class="col-5">Email</dt>
          <dd class="col-7">{{ user.email|default:"—" }}</dd>
          <dt class="col-5">Member since</dt>
          <dd class="col-7 mb-0">{{ user.date_joined|date:"M j, Y" }}</dd>
        </dl>
      </div>
    </div>
  </div>

  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h6 text-uppercase text-muted mb-3">My Orders</h2>
        <p class="text-muted mb-0">Your orders will appear here.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
